# This job deploys the project to EAW production server.
# It uses the code/docker-compose.yml file to deploy the modules as connected container services.
# Environment variables to be set:
#   EAW_PROD_SERVER_HOST
#  Used in Compose:
#     EAW_FRONTEND_DOCKER_OUT
prod-deployment:
  stage: deploy-production
  tags:
    - eaw-production
  only:
    - master
    - /^hotfix.*/
  dependencies:
    - frontend-prod-build
  variables:
    RELEASE_TAG: "latest"
  script:
    - cd ./ci/eaw-environment/
    - docker-compose down
    - docker rmi evaluator-accesibility-web-db:${RELEASE_TAG} || true
    - docker rmi evaluator-accesibility-web-mongo:${RELEASE_TAG} || true
    - docker rmi evaluator-accesibility-web-api:${RELEASE_TAG} || true
    - docker rmi evaluator-accesibility-queue-api:${RELEASE_TAG} || true
    - docker rmi evaluator-accesibility-web-app:${RELEASE_TAG} || true
    - docker-compose up -d
    - docker rmi $(docker images -f "dangling=true" -q) || true
  environment:
    name: "EAW Production Server"
    # This URL is assumed to be configured at the web server proxy.
    url: "http://$EAW_PROD_SERVER_HOST/eaw/"
