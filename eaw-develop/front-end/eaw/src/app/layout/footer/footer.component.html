<footer
  class="page-footer font-small bg-lightgray lighten-3 pt-4"
  [attr.aria-label]="'layout.footer.title' | translate"
>
  <div class="container">
    <div class="row justify-content-end">
      <div class="col-lg-2 col-md-4 mt-1 mb-4 mr-4">
        <div class="view overlay z-depth-1-half">
          <img
            src="./assets/img/layout/tec_logo.png"
            class="img-fluid"
            [attr.alt]="'layout.footer.tec' | translate"
          />
        </div>
      </div>
      <div class="col-lg-3 col-md-5 mb-4">
        <div class="view overlay z-depth-1-half">
          <img
            src="./assets/img/layout/otai_logo.png"
            class="img-fluid"
            [attr.alt]="'layout.footer.otai' | translate"
          />
        </div>
      </div>
    </div>
  </div>
</footer>
