<pagination-template
  #pT="paginationApi"
  [maxSize]="maxSize"
  (pageChange)="handlePagination($event)"
  [id]="id"
>
  <div
    class="c-notice-selection-msg"
    aria-live="polite"
    *ngIf="pT.pages.length == 0"
  >
    {{ nothingMessage }}
  </div>
  <ul
    class="ngx-pagination"
    role="navigation"
    *ngIf="!(pT.pages.length <= 1)"
    aria-live="polite"
  >
    <li
      class="pagination-previous"
      [class.disabled]="pT.isFirstPage()"
      *ngIf="directionLinks"
    >
      <a
        class="ngx-pagination-fs"
        tabindex="0"
        *ngIf="1 < pT.getCurrent()"
        (keyup.enter)="pT.previous()"
        (click)="pT.previous()"
        [attr.aria-label]="previousLabel + ' ' + screenReaderPageLabel"
      >
        <i class="fas fa-angle-left"></i>
        <span class="show-for-sr">{{ screenReaderPageLabel }}</span>
      </a>
      <span class="ngx-pagination-fs" *ngIf="pT.isFirstPage()">
        <i class="fas fa-angle-left"></i>
        <span class="show-for-sr">{{ screenReaderPageLabel }}</span>
      </span>
    </li>
    <li class="small-screen">{{ pT.getCurrent() }} / {{ pT.getLastPage() }}</li>
    <li
      [class.current]="pT.getCurrent() === page.value"
      [class.ellipsis]="page.label === '...'"
      *ngFor="let page of pT.pages"
      tabindex="0"
    >
      <a
        tabindex="0"
        (keyup.enter)="pT.setCurrent(page.value)"
        (click)="pT.setCurrent(page.value)"
        *ngIf="pT.getCurrent() !== page.value"
      >
        <span class="show-for-sr">{{ screenReaderPageLabel }} </span>
        <span>{{ page.label }}</span>
      </a>
      <ng-container *ngIf="pT.getCurrent() === page.value">
        <span class="show-for-sr">{{ screenReaderCurrentLabel }} </span>
        <span attr.aria-label="{{ screenReaderCurrentLabel }}">{{
          page.label
        }}</span>
      </ng-container>
    </li>
    <li
      class="pagination-next"
      [class.disabled]="pT.isLastPage()"
      *ngIf="directionLinks"
    >
      <a
        class="ngx-pagination-fs"
        tabindex="0"
        *ngIf="!pT.isLastPage()"
        (keyup.enter)="pT.next()"
        (click)="pT.next()"
        [attr.aria-label]="nextLabel + ' ' + screenReaderPageLabel"
      >
        <i class="fas fa-angle-right"></i>
        <span class="show-for-sr">{{ screenReaderPageLabel }}</span>
      </a>
      <span class="ngx-pagination-fs" *ngIf="pT.isLastPage()">
        <i class="fas fa-angle-right"></i>
        <span class="show-for-sr">{{ screenReaderPageLabel }}</span>
      </span>
    </li>
  </ul>
</pagination-template>
